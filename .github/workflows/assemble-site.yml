name: assemble-site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble parts into site files
        run: |
          python3 << 'PY'
          import pathlib, base64, re
          root = pathlib.Path("_assemble")
          if not root.exists():
              print("no _assemble")
              raise SystemExit(0)
          text_dests, bin_dests = {}, {}
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              rel = str(p.relative_to(root)).replace("\\", "/")
              m = re.match(r"(.+)\.part(\d+)\.b64$", rel)
              if m:
                  bin_dests.setdefault(m.group(1), []).append((int(m.group(2)), p))
                  continue
              m = re.match(r"(.+)\.part(\d+)\.txt$", rel)
              if m:
                  text_dests.setdefault(m.group(1), []).append((int(m.group(2)), p))
          for dest, parts in text_dests.items():
              parts = [p for _, p in sorted(parts)]
              out = pathlib.Path(dest)
              out.parent.mkdir(parents=True, exist_ok=True)
              data = "".join(pp.read_text(encoding="utf-8") for pp in parts)
              out.write_text(data, encoding="utf-8")
              print(f"text {dest}: {len(data)} from {len(parts)}")
          for dest, parts in bin_dests.items():
              parts = [p for _, p in sorted(parts)]
              out = pathlib.Path(dest)
              out.parent.mkdir(parents=True, exist_ok=True)
              b64 = "".join(pp.read_text(encoding="utf-8") for pp in parts)
              raw = base64.b64decode(b64)
              out.write_bytes(raw)
              print(f"bin {dest}: {len(raw)} from {len(parts)}")
          PY
      - name: Cleanup staging and probes
        run: |
          rm -rf _assemble
          rm -f _probe_size.txt
          rm -f bsl-learn/assets/media/_probe.txt bsl-learn/assets/media/_probe2.bin || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Assemble static site from chunks"
          git push
